name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak SVG
        run: |
          python3 << 'EOF'
          import urllib.request, json
          from datetime import date, timedelta

          url = "https://github-contributions-api.jogruber.de/v4/Ashrithhn?y=last"
          with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())

          contribs = {d["date"]: d["count"] for d in data["contributions"]}

          today = date.today()
          streak = 0
          d = today
          while True:
              ds = d.strftime("%Y-%m-%d")
              if contribs.get(ds, 0) > 0:
                  streak += 1
                  d -= timedelta(days=1)
              else:
                  if d == today:
                      d -= timedelta(days=1)
                      continue
                  break

          start = (today - timedelta(days=streak-1)).strftime("%b %-d, %Y")
          end = today.strftime("%b %-d, %Y")

          svg = f'''<svg width="480" height="150" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#161b22"/>
              <stop offset="100%" stop-color="#0d1117"/>
            </linearGradient>
          </defs>
          <rect width="480" height="150" rx="15" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>
          <text x="240" y="40" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">🔥 CURRENT STREAK</text>
          <text x="240" y="100" fill="#f78166" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="bold" text-anchor="middle">{streak}</text>
          <text x="240" y="120" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">DAYS</text>
          <text x="240" y="142" fill="#484f58" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">{start} – {end}</text>
          </svg>'''

          with open("streak.svg", "w") as f:
              f.write(svg)
          print(f"Streak: {streak} days")
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push

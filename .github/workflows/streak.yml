name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak SVG
        run: |
          python3 << 'EOF'
          import urllib.request, json
          from datetime import date, timedelta

          url = "https://github-contributions-api.jogruber.de/v4/Ashrithhn?y=last"
          with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())

          contribs = {d["date"]: d["count"] for d in data["contributions"]}
          total = sum(d["count"] for d in data["contributions"])

          today = date.today()

          # Current streak
          streak = 0
          d = today
          while True:
              ds = d.strftime("%Y-%m-%d")
              if contribs.get(ds, 0) > 0:
                  streak += 1
                  d -= timedelta(days=1)
              else:
                  if d == today:
                      d -= timedelta(days=1)
                      continue
                  break
          streak_start = (today - timedelta(days=streak - 1)).strftime("%b %-d, %Y")
          streak_end = today.strftime("%b %-d, %Y")

          # Longest streak
          longest = 0
          cur = 0
          long_start_tmp = None
          long_start = None
          long_end = None
          prev_date = None
          for entry in data["contributions"]:
              ed = date.fromisoformat(entry["date"])
              if entry["count"] > 0:
                  if prev_date and (ed - prev_date).days == 1:
                      cur += 1
                  else:
                      cur = 1
                      long_start_tmp = ed
                  if cur > longest:
                      longest = cur
                      long_start = long_start_tmp
                      long_end = ed
              prev_date = ed
          long_start_str = long_start.strftime("%b %-d, %Y") if long_start else ""
          long_end_str = long_end.strftime("%b %-d, %Y") if long_end else ""

          first = next((d["date"] for d in data["contributions"] if d["count"] > 0), "")
          first_str = date.fromisoformat(first).strftime("%b %-d, %Y") if first else ""

          svg = f'''<svg width="600" height="170" xmlns="http://www.w3.org/2000/svg">
          <rect width="600" height="170" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

          <!-- Dividers -->
          <line x1="200" y1="20" x2="200" y2="150" stroke="#21262d" stroke-width="1"/>
          <line x1="400" y1="20" x2="400" y2="150" stroke="#21262d" stroke-width="1"/>

          <!-- Total Contributions -->
          <text x="100" y="55" fill="#58a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" text-anchor="middle">{total}</text>
          <text x="100" y="80" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Total Contributions</text>
          <text x="100" y="115" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">{first_str}</text>
          <text x="100" y="130" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">– Present</text>

          <!-- Current Streak (middle, bigger) -->
          <text x="300" y="42" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">🔥</text>
          <text x="300" y="72" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="bold" text-anchor="middle">{streak}</text>
          <text x="300" y="95" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Current Streak</text>
          <text x="300" y="118" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">{streak_start}</text>
          <text x="300" y="133" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">– {streak_end}</text>

          <!-- Longest Streak -->
          <text x="500" y="55" fill="#58a6ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="bold" text-anchor="middle">{longest}</text>
          <text x="500" y="80" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle">Longest Streak</text>
          <text x="500" y="115" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">{long_start_str}</text>
          <text x="500" y="130" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">– {long_end_str}</text>
          </svg>'''

          with open("streak.svg", "w") as f:
              f.write(svg)
          print(f"Total: {total} | Current streak: {streak} | Longest: {longest}")
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push

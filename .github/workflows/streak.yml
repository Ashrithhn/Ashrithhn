name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Download streak image
        run: |
          curl -L -o streak.svg "https://streak-stats.demolab.com/?user=Ashrithhn&theme=github-dark&hide_border=true&timezone=Asia/Kolkata"
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push

name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak SVG
        run: |
          python3 << 'EOF'
          import urllib.request, json
          from datetime import date, timedelta

          url = "https://github-contributions-api.jogruber.de/v4/Ashrithhn?y=last"
          with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())

          contribs = {d["date"]: d["count"] for d in data["contributions"]}

          today = date.today()
          streak = 0
          d = today
          while True:
              ds = d.strftime("%Y-%m-%d")
              if contribs.get(ds, 0) > 0:
                  streak += 1
                  d -= timedelta(days=1)
              else:
                  if d == today:
                      d -= timedelta(days=1)
                      continue
                  break

          start = (today - timedelta(days=streak-1)).strftime("%b %-d")
          end = today.strftime("%b %-d")

          svg = f'''<svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="120" rx="12" fill="#0d1117"/>
          <text x="200" y="38" fill="#8b949e" font-family="Arial" font-size="14" text-anchor="middle">Current Streak</text>
          <text x="200" y="82" fill="#f78166" font-family="Arial" font-size="48" font-weight="bold" text-anchor="middle">{streak}</text>
          <text x="200" y="105" fill="#8b949e" font-family="Arial" font-size="12" text-anchor="middle">{start} – {end}</text>
          </svg>'''

          with open("streak.svg", "w") as f:
              f.write(svg)
          print(f"Streak: {streak} days ({start} - {end})")
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push

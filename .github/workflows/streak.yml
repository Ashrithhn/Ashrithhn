name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Calculate and generate streak SVG
        run: |
          python3 << 'EOF'
          import urllib.request
          import json
          from datetime import date, timedelta

          url = "https://github-contributions-api.jogruber.de/v4/Ashrithhn?y=last"
          with urllib.request.urlopen(url) as r:
              data = json.loads(r.read())

          contribs = {d["date"]: d["count"] for d in data["contributions"]}

          today = date.today()
          streak = 0
          d = today
          while True:
              ds = d.strftime("%Y-%m-%d")
              if contribs.get(ds, 0) > 0:
                  streak += 1
                  d -= timedelta(days=1)
              else:
                  if d == today:
                      d -= timedelta(days=1)
                      ds = d.strftime("%Y-%m-%d")
                      if contribs.get(ds, 0) > 0:
                          streak += 1
                          d -= timedelta(days=1)
                          continue
                  break

          svg = f'''<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
          <rect width="400" height="100" rx="10" fill="#0d1117"/>
          <text x="200" y="35" fill="#adbac7" font-family="Arial" font-size="13" text-anchor="middle">Current Streak</text>
          <text x="200" y="72" fill="#f78166" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle">{streak} days</text>
          </svg>'''

          with open("streak.svg", "w") as f:
              f.write(svg)
          print(f"Streak: {streak} days")
          EOF

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add streak.svg
          git diff --staged --quiet || git commit -m "Update streak stats"
          git push
